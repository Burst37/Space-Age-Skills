<section id="board" class="b-sec" data-alt="The Lineup" aria-labelledby="board-h">
  <div class="b-head">
    <p class="b-kick micro"><i></i>Drop 01 &middot; the lineup</p>
    <h2 class="mega b-h" id="board-h">The lineup</h2>
    <p class="b-sub body">Nineteen pieces. Every one of them a statement. Pick a row.</p>
  </div>

  <div class="b-bar">
    <div class="b-sort" role="group" aria-label="Sort the board">
      <span class="micro">Sort</span>
      <button class="b-s micro is-on" type="button" data-sort="gate">Drop order</button>
      <button class="b-s micro" type="button" data-sort="price">Price</button>
      <button class="b-s micro" type="button" data-sort="name">A–Z</button>
    </div>
    <p class="b-clock micro"><b>19</b> pieces in Drop 01</p>
  </div>

  <div class="b-board" role="table" aria-label="Drop 01 lineup">
    <div class="b-row b-row-h micro" role="row">
      <span role="columnheader">No.</span>
      <span role="columnheader">Piece</span>
      <span role="columnheader">The word</span>
      <span role="columnheader">Sizes</span>
      <span role="columnheader">Price</span>
      <span role="columnheader"></span>
    </div>
    <div class="b-rows" id="b-rows"></div>
  </div>

  <figure class="b-peek" id="b-peek" aria-hidden="true"><img alt="" id="b-peek-img"></figure>
</section>
