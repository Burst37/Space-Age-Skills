<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSAP 3.15 plugin gallery</title>
  <style>
    :root { color-scheme: light dark; --fg: #111; --bg: #fafafa; --accent: #6d28d9; }
    @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #101014; --accent: #a78bfa; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0 16px 120px; font-family: system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    section { max-width: 760px; margin: 0 auto; padding: 56px 0; border-bottom: 1px solid #8884; }
    h1 { font-size: clamp(2rem, 7vw, 4rem); line-height: 1.05; margin: 0; }
    h2 { margin: 0 0 16px; font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
    .grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .card { width: 96px; height: 64px; background: var(--accent); border-radius: 8px; color: #fff; display: grid; place-items: center; }
    .grid.list { flex-direction: column; } .grid.list .card { width: 100%; }
    .knob { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); cursor: grab; touch-action: none; display: grid; place-items: center; color: #fff; }
    svg { width: 100%; max-width: 420px; height: auto; overflow: visible; }
    #dot { fill: var(--fg); }
    button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #8886; background: transparent; color: inherit; cursor: pointer; }
    #log { position: fixed; bottom: 0; left: 0; right: 0; background: #000c; color: #8f8; font: 12px/1.4 monospace; padding: 6px 12px; }
  </style>
</head>
<body>
  <section><h1 class="headline">Plugins turn tweens into craft.</h1></section>

  <section>
    <h2>Flip</h2>
    <button id="flipBtn" type="button">Toggle layout</button>
    <div id="flipGrid" class="grid" style="margin-top:16px"><div class="card" data-flip-id="a">A</div><div class="card" data-flip-id="b">B</div><div class="card" data-flip-id="c">C</div></div>
  </section>

  <section>
    <h2>DrawSVG · MotionPath · MorphSVG</h2>
    <svg viewBox="0 0 400 160" aria-hidden="true">
      <path id="route" d="M10,120 C100,10 200,10 300,120 S390,150 390,60" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle id="dot" r="8"/>
      <path id="blob" d="M60,150 a20,20 0 1,0 .1,0z" fill="currentColor" opacity=".35"/>
      <path id="star" d="M60,130 l8,18 20,2 -15,13 5,19 -18,-10 -18,10 5,-19 -15,-13 20,-2z" fill="none" stroke="none"/>
    </svg>
  </section>

  <section>
    <h2>Draggable · Inertia</h2>
    <div class="knob" id="knob">drag</div>
  </section>

  <section>
    <h2>TextPlugin · ScrambleText</h2>
    <p id="type" style="min-height:1.5em"></p>
    <p id="decode" style="font-family:monospace">ACCESS PENDING</p>
  </section>

  <section>
    <h2>ScrollTo · CustomEase · Observer</h2>
    <button id="toTop" type="button">Back to top</button>
    <p id="obs">Observer idle</p>
  </section>

  <div id="log" role="status">booting…</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Flip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/MotionPathPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/MorphSVGPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/InertiaPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/TextPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrambleTextPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollToPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Observer.min.js"></script>
  <script>
    const log = document.getElementById('log')
    window.__results = {}
    const ok = (k, v = true) => { window.__results[k] = v }

    // Content stays visible and the page stays usable if the CDN is blocked.
    if (!window.gsap) { log.textContent = 'GSAP unavailable — static content shown'; }
    else {
      gsap.registerPlugin(ScrollTrigger, SplitText, Flip, DrawSVGPlugin, MotionPathPlugin, MorphSVGPlugin,
        Draggable, InertiaPlugin, TextPlugin, ScrambleTextPlugin, ScrollToPlugin, CustomEase, Observer)

      const mm = gsap.matchMedia()

      mm.add('(prefers-reduced-motion: no-preference)', () => {
        // SplitText — masked line reveal, re-split on resize, tween returned from onSplit
        document.fonts.ready.then(() => {
          SplitText.create('.headline', {
            type: 'lines, words', mask: 'lines', autoSplit: true, aria: 'auto',
            onSplit(self) {
              ok('splitLines', self.lines.length)
              return gsap.from(self.lines, { yPercent: 110, stagger: 0.08, duration: 0.9, ease: 'power4.out' })
            }
          })
        })

        // DrawSVG + MotionPath + MorphSVG
        gsap.from('#route', { drawSVG: 0, duration: 1.2, ease: 'power2.out' })
        gsap.to('#dot', { motionPath: { path: '#route', align: '#route', alignOrigin: [0.5, 0.5], autoRotate: true }, duration: 4, ease: 'none', repeat: -1 })
        gsap.to('#blob', { morphSVG: { shape: '#star', shapeIndex: 'auto', map: 'complexity' }, duration: 1.2, yoyo: true, repeat: -1 })

        // TextPlugin + ScrambleText
        gsap.to('#type', { text: { value: 'Built for the Space Age', delimiter: '' }, duration: 2, ease: 'none' })
        gsap.to('#decode', { scrambleText: { text: 'ACCESS GRANTED', chars: 'upperCase', speed: 0.6, revealDelay: 0.3 }, duration: 2 })
      })

      mm.add('(prefers-reduced-motion: reduce)', () => {
        document.getElementById('type').textContent = 'Built for the Space Age'
        document.getElementById('decode').textContent = 'ACCESS GRANTED'
      })

      // Flip
      const grid = document.getElementById('flipGrid')
      document.getElementById('flipBtn').addEventListener('click', () => {
        const state = Flip.getState('#flipGrid .card')
        grid.classList.toggle('list')
        Flip.from(state, { duration: 0.6, ease: 'power2.inOut', absolute: true, stagger: 0.05,
          onComplete: () => ok('flipDone') })
      })

      // Draggable + Inertia
      const [drag] = Draggable.create('#knob', { type: 'rotation', inertia: true, snap: (v) => Math.round(v / 45) * 45 })
      ok('draggable', !!drag)

      // CustomEase + ScrollTo
      CustomEase.create('hop', 'M0,0 C0.2,0 0.1,1 0.5,1.1 0.8,1.2 0.7,1 1,1')
      document.getElementById('toTop').addEventListener('click', () =>
        gsap.to(window, { scrollTo: { y: 0, autoKill: true }, duration: 1, ease: 'hop' }))
      ok('customEase', typeof CustomEase.get('hop') === 'function')

      // Observer — normalised wheel/touch intent (does not scroll the page)
      Observer.create({ target: window, type: 'wheel,touch,pointer', tolerance: 12,
        onUp: () => { document.getElementById('obs').textContent = 'Observer: up' },
        onDown: () => { document.getElementById('obs').textContent = 'Observer: down' } })
      ok('observer', Observer.getAll().length)

      log.textContent = 'GSAP ' + gsap.version + ' ready'
    }
  </script>
</body>
</html>
