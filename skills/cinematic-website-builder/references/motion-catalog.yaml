# CWB motion picker — effect catalog (v3.3.0). Read by scripts/motion-pick.mjs.
# plain:   what Chuma would say when he sees it (he picks by eye, not by name)
# says:    phrases from briefs / moodboard teardowns that map here (animation-vocabulary + site-reverse-engineer terms)
# technique: the exact implementation the build must use — verify.mjs --motion-plan checks it is running
# demo:    live demo in tests/gallery.dist.html (?focus=<module> scrolls to it); clip = optional recorded loop
# profile: gentle = trust sectors allowed (home care, law, medical, SaaS) · bold = bold sectors only · both
# fits:    wireframe section kinds it suits · signature: can carry the page's one signature moment
effects:
  - id: video-per-section
    plain: Every section has its own short film playing behind it; only the one you're looking at plays
    technical: Video-per-section chapters (lazy src on intersection, single active <video>)
    technique: "IntersectionObserver, one active video, posters + pause control; CSS scrim"
    module: video-chapters
    libs: []
    cost: 4
    profile: both
    gentle: "Slower, calmer loops; one autoplay in the first viewport; stills on reduced motion / save-data"
    bold: "Faster cuts, stronger camera moves; still one video at a time"
    fits: [stacked-chapters, hero, split-30-70, split-50-50]
    signature: true
    says: [video for each section, video behind each section, chapter films, background video sections, scrolling films]
  - id: expanding-video-panels
    plain: A row of tall panels; the one you point at opens wide and its video plays
    technical: Hover-expand accordion (inner 2×, neighbours shift ½ bar)
    technique: "GSAP tween width/x, power3.out 0.6s in, 0.1s hold + 0.4s out; tap-to-expand stack on phones"
    module: expand-panels
    libs: [gsap]
    cost: 6
    profile: both
    gentle: "data-variant=gentle: 1.4×, neighbours still, 0.45s power2.out, posters only"
    bold: "data-variant=bold: 2×, neighbours shift, one video at a time"
    fits: [gallery, services-index, hero, portfolio]
    signature: true
    says: [expanding panels, panels expand on hover, hover accordion, video panels, accordion gallery with video]
  - id: masked-headline-reveal
    plain: The headline slides up into place one line at a time, like it's coming out from behind a mask
    technical: Masked line reveal
    technique: "GSAP SplitText {type:'lines', mask:'lines', autoSplit:true, aria:'auto'} + yPercent 100→0 stagger"
    module: line-reveal
    libs: [gsap, splittext]
    cost: 3
    profile: both
    gentle: "0.9s, power2.out, small stagger"
    bold: "1.1s, expo.out, word-level"
    fits: [hero, hero-compact, cta, text]
    signature: false
    says: [words slide up, text slides up line by line, masked reveal, line reveal, split text]
  - id: scroll-reveal
    plain: Things fade and rise gently into place as you scroll to them
    technical: Scroll reveal on a CSS view() timeline
    technique: "CSS animation-timeline: view(); animation-range: entry 0% cover 30% ([data-nreveal])"
    module: css-view-reveal
    libs: []
    cost: 0
    profile: both
    gentle: "opacity + 16px rise"
    bold: "opacity + 40px rise + slight scale"
    fits: [text, steps, list, faq, grid, nap, services-index, capsule]
    signature: false
    says: [fade in on scroll, appears as you scroll, scroll reveal, fade up]
  - id: soft-lenis
    plain: The whole page scrolls a little smoother and heavier, like it has momentum
    technical: Smooth scroll (Lenis) synced to the GSAP ticker
    technique: "Lenis 1.3.x via <html data-cwb-smooth=soft> (lerp 0.14), desktop fine pointer only, off on touch/RM"
    module: lenis
    libs: [lenis]
    cost: 0
    profile: both
    gentle: "soft (lerp 0.14)"
    bold: "standard (lerp 0.1)"
    fits: [page]
    signature: false
    says: [smooth scroll, buttery scroll, inertia scroll, lenis]
