# Optional source: Chuma's UI8 library (Drive: "UI8 Extracted Assets - Batch 2"; inventory
# /workspace/ui8-inventory.csv — 20 font zips, e.g. Fenoura, Velorina, Qirvalen, Nevanta, Gotkin,
# Northern Sans, Forge Sans, Boldet/Rantaro/Rowsky Display). These are NOT in the scored library:
# each zip's licence file must be read first (UI8 licences differ: personal vs commercial vs
# web-embedding). Only a font whose licence allows commercial web embedding may be self-hosted
# (WOFF2), and only as display (hero/wordmark, one moment per page). Record licence + source in
# design-spec.md → Type → licence. Never upload a UI8 font file to a public repo or CDN.
