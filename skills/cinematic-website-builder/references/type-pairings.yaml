# CWB type picker — curated pairing library (v3.3.0). Read by scripts/type-specimens.mjs.
# Every family here was checked to resolve on its provider's CSS API on 2026-11-15.
# dials: 0..1  warmth (0 technical → 1 warm) · classic (0 modern → 1 classic) · loud (0 calm → 1 loud)
# providers: fontshare (ITF Free Font License: free for personal + commercial use, self-host allowed)
#            bunny (Google-compatible, GDPR-safe; families below are SIL OFL 1.1)
# One provider per page: every pairing below uses ONE provider.
# weights = the files you load (max 2 families, ≤ 4 files total).
banned: [Inter, Poppins, Lato, Fraunces, Instrument Serif]      # unless the client's brand guide already uses them
overused: [Montserrat, Roboto, Open Sans, Playfair Display, Space Grotesk, DM Sans]   # allowed, scored down
banned_display_styles_trust_sectors: [liquid-glass, 3d-goo, chrome-blob]   # law, SaaS, medical, home-healthcare

pairings:
  - id: care-editorial
    display: { family: Newsreader, weights: [500] }
    text: { family: Figtree, weights: [400, 600] }
    provider: bunny
    licence: OFL-1.1
    variable: true
    dials: { warmth: 0.85, classic: 0.7, loud: 0.2 }
    mood: [warm, editorial, calm, trustworthy]
    sectors: [home-healthcare, senior-care, wellness, nonprofit, law]
    variant: gentle
    jumbo: { ok: true, advance: 0.6 }
    notes: Book-serif headlines with a friendly geometric text face. The direct fix for Georgia + Arial.
