<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lenis + GSAP ScrollTrigger</title>
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.26/dist/lenis.css">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    section { min-height: 100vh; display: grid; place-items: center; font-size: clamp(2rem, 8vw, 6rem); }
    .box { width: 120px; height: 120px; background: currentColor; border-radius: 12px; }
  </style>
</head>
<body>
  <section><h1>Scroll</h1></section>
  <section><div class="box"></div></section>
  <section><h2>End</h2></section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
  <script>
    // Content must stay visible and scrollable if any CDN script fails.
    if (window.gsap && window.ScrollTrigger && window.Lenis) {
      gsap.registerPlugin(ScrollTrigger)
      const lenis = new Lenis()                          // reduced-motion handled by Lenis itself
      lenis.on('scroll', ScrollTrigger.update)
      gsap.ticker.add((t) => lenis.raf(t * 1000))        // seconds → ms
      gsap.ticker.lagSmoothing(0)

      gsap.to('.box', {
        rotate: 360, x: 300, ease: 'none',
        scrollTrigger: { trigger: '.box', start: 'top bottom', end: 'bottom top', scrub: true }
      })
    }
  </script>
</body>
</html>
