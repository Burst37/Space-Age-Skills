<!doctype html><html><head><meta charset="utf-8"><style>
/*FONTS*/
:root{/*TOKENS*/}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:#fff;font-family:var(--body),sans-serif}
.abs{position:absolute}
#bg{inset:0;background:radial-gradient(900px 700px at 20% 20%,color-mix(in oklab,var(--a1) 38%,transparent),transparent 70%),radial-gradient(1000px 800px at 85% 85%,color-mix(in oklab,var(--a4) 34%,transparent),transparent 70%),radial-gradient(700px 600px at 70% 10%,color-mix(in oklab,var(--a2) 22%,transparent),transparent 70%),var(--bg)}
#grain{inset:0;opacity:.07;mix-blend-mode:overlay}
.eyebrow{font:700 22px var(--body);letter-spacing:.38em;color:var(--soft);text-transform:uppercase}
.t{font-family:var(--display),serif;font-weight:600;letter-spacing:-.02em;line-height:.98}
.mask{overflow:hidden;position:absolute}
.col{position:absolute;width:210px;height:470px;border-radius:30px;border:1.5px solid rgba(255,255,255,.2);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));backdrop-filter:blur(8px)}
.col .day{position:absolute;left:0;right:0;top:22px;text-align:center;font:700 24px var(--body);letter-spacing:.24em;color:var(--soft)}
.col .bar{position:absolute;left:34px;right:34px;bottom:30px;border-radius:18px 18px 10px 10px}
.col .val{position:absolute;left:0;right:0;text-align:center;font:800 40px var(--body);letter-spacing:-.02em}
.col .unit{font:600 20px var(--body);opacity:.8}
#cap{left:147px;top:945px;width:1626px}
#cap .h{font:700 30px var(--body);letter-spacing:.2em;text-transform:uppercase}
#cap .s{font:500 36px var(--body);color:#fff;margin-top:6px}
.chip{position:absolute;padding:16px 30px;border:1.5px solid rgba(255,255,255,.3);border-radius:60px;font:700 30px var(--body);background:rgba(255,255,255,.1)}
</style></head><body>
<div id="bg" class="abs"></div><canvas id="grain" class="abs" width="480" height="270" style="width:1920px;height:1080px"></canvas>
<div class="abs eyebrow" id="eb" style="left:147px;top:96px"></div>
<div class="mask" style="left:147px;top:150px;width:1500px;height:130px"><div class="t" id="h1" style="font-size:118px;white-space:nowrap"></div></div>
<div class="mask" style="left:147px;top:278px;width:1500px;height:130px"><div class="t" id="h2" style="font-size:118px;white-space:nowrap;color:var(--hl)"></div></div>
<div id="cols"></div><div id="cap" class="abs"></div><div id="chips"></div>
<div id="fade" class="abs" style="inset:0;background:var(--bg);opacity:0"></div>
<script>
const D=/*DATA*/null;
const $=id=>document.getElementById(id), cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const ph=(t,a,d,f=eo)=>f(cl((t-a)/d));
$('eb').textContent=D.eyebrow; $('h1').textContent=D.line1; $('h2').textContent=D.line2;
// grain
const g=$('grain').getContext('2d'),gi=g.createImageData(480,270);for(let i=0;i<gi.data.length;i+=4){const v=Math.random()*255;gi.data[i]=gi.data[i+1]=gi.data[i+2]=v;gi.data[i+3]=255}g.putImageData(gi,0,0);
const maxC=Math.max(...Object.values(D.tiers).map(t=>t.carbs));
const cols=$('cols');
D.week.forEach((k,i)=>{const t=D.tiers[k];const c=document.createElement('div');c.className='col';c.id='c'+i;c.style.left=(147+i*236)+'px';c.style.top='440px';
 c.innerHTML=`<div class="day">${D.dow[i]}</div><div class="bar" id="b${i}" style="background:linear-gradient(180deg,${t.color},color-mix(in oklab,${t.color} 55%,#000))"></div><div class="val" id="v${i}" style="color:#fff">0<span class="unit"> g</span></div>`;cols.appendChild(c);});
const chips=$('chips'); D.chips.forEach((txt,i)=>{const e=document.createElement('div');e.className='chip';e.id='ch'+i;e.style.left=(147+i*0)+'px';e.style.top='955px';e.textContent=txt;chips.appendChild(e)});
let xs=147;[...chips.children].forEach(e=>{e.style.left=xs+'px';xs+=e.getBoundingClientRect().width+22});
const BARMAX=270;
function render(t){
  $('bg').style.backgroundPosition=`${Math.sin(t*.5)*40}px ${Math.cos(t*.4)*30}px`;
  $('bg').style.transform=`scale(${1.08+0.03*Math.sin(t*.4)})`;
  $('eb').style.opacity=ph(t,.1,.6);
  $('h1').style.transform=`translateY(${(1-ph(t,.35,.9))*150}px)`; $('h2').style.transform=`translateY(${(1-ph(t,.65,.9))*150}px)`;
  // phase windows: [train, keto, low]
  const S=D.steps; // [{tier,start,end,head,sub}]
  let act=null; S.forEach(s=>{if(t>=s.start&&t<s.end)act=s});
  D.week.forEach((k,i)=>{
    const tt=D.tiers[k], p=ph(t,1.4+i*.14,1.1,eb), c=$('c'+i), bar=$('b'+i), val=$('v'+i);
    const on=!act||act.tier===k; const dim=on?1:.28; const pulse=act&&on?1+0.035*Math.sin((t-act.start)*5):1;
    c.style.opacity=ph(t,1.3+i*.14,.5)*dim; c.style.transform=`translateY(${(1-ph(t,1.3+i*.14,.7))*80}px) scale(${pulse})`;
    c.style.borderColor=act&&on?tt.color:'rgba(255,255,255,.2)'; c.style.boxShadow=act&&on?`0 0 70px ${tt.color}66`:'none';
    const h=BARMAX*(tt.carbs/maxC)*cl(p,0,1.06); bar.style.height=h+'px';
    val.style.bottom=(30+h+16)+'px'; val.innerHTML=Math.round(tt.carbs*cl(p,0,1))+'<span class="unit"> g</span>'+(tt.netNote&&p>.9?`<div class="unit" style="font-size:20px;margin-top:2px">${tt.netNote}</div>`:'');
  });
  const cap=$('cap'); if(act){cap.innerHTML=`<div class="h" style="color:${D.tiers[act.tier].color}">${act.head}</div><div class="s">${act.sub}</div>`; cap.style.opacity=Math.min(ph(t,act.start,.4),1-ph(t,act.end-.35,.35));cap.style.transform=`translateY(${(1-ph(t,act.start,.5))*24}px)`}else cap.style.opacity=0;
  D.chips.forEach((_,i)=>{const e=$('ch'+i),p=ph(t,D.chipStart+i*.2,.6,eb);e.style.opacity=cl(p*1.5)*(1-ph(t,D.dur-.6,.5));e.style.transform=`scale(${.7+.3*p})`});
  $('fade').style.opacity=ph(t,D.dur-.5,.5,eio);
}
document.fonts.ready.then(()=>render(0));
</script></body></html>
